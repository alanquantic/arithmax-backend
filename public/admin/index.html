<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arithmax · Administración</title>
<style>
  :root { --accent:#1a56db; --accent-dark:#1544ad; --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --danger:#dc2626; --ok:#059669; --warn:#d97706; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  button { cursor:pointer; font:inherit; }
  input,select { font:inherit; padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; width:100%; background:#fff; }
  input:focus,select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .btn { padding:8px 16px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-weight:500; }
  .btn:hover { background:var(--accent-dark); }
  .btn.secondary { background:#e5e7eb; color:var(--text); }
  .btn.danger { background:var(--danger); }
  .btn.small { padding:4px 10px; font-size:13px; }

  /* Login */
  #login-view { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card { background:var(--card); padding:40px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); width:360px; }
  .login-card h1 { font-size:22px; margin-bottom:4px; }
  .login-card p { color:var(--muted); font-size:14px; margin-bottom:24px; }
  .login-card label { display:block; font-size:13px; font-weight:500; margin:12px 0 4px; }
  .login-card .btn { width:100%; margin-top:20px; }
  .error-msg { color:var(--danger); font-size:13px; margin-top:12px; min-height:18px; }

  /* App */
  #app-view { display:none; }
  header { background:#111827; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header .brand { font-weight:700; font-size:17px; }
  header .brand span { color:#93c5fd; }
  header .right { display:flex; align-items:center; gap:16px; font-size:13px; color:#d1d5db; }
  header button { background:none; border:1px solid #4b5563; color:#d1d5db; border-radius:6px; padding:5px 12px; font-size:13px; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { border:none; background:none; padding:8px 16px; border-radius:6px; font-weight:500; color:var(--muted); }
  .tabs button.active { background:#dbeafe; color:var(--accent); }
  .toolbar { display:flex; gap:12px; margin-bottom:16px; align-items:center; }
  .toolbar input { max-width:320px; }
  .card { background:var(--card); border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); overflow:hidden; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; padding:10px 14px; background:#f9fafb; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid #e5e7eb; white-space:nowrap; }
  td { padding:10px 14px; border-bottom:1px solid #f3f4f6; white-space:nowrap; }
  tr:hover td { background:#f9fafb; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:500; }
  .badge.active { background:#d1fae5; color:var(--ok); }
  .badge.inactive { background:#fee2e2; color:var(--danger); }
  .badge.none { background:#f3f4f6; color:var(--muted); }
  .badge.admin { background:#ede9fe; color:#6d28d9; }
  .badge.processed { background:#d1fae5; color:var(--ok); }
  .badge.failed { background:#fee2e2; color:var(--danger); }
  .badge.skipped { background:#fef3c7; color:var(--warn); }
  .pager { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; font-size:13px; color:var(--muted); }
  .pager .btns { display:flex; gap:8px; }
  .actions { display:flex; gap:6px; }
  .muted { color:var(--muted); }

  /* Modal */
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(17,24,39,.55); align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px; z-index:50; }
  .modal-backdrop.open { display:flex; }
  .modal { background:#fff; border-radius:12px; width:640px; max-width:100%; padding:28px; }
  .modal h2 { font-size:18px; margin-bottom:20px; }
  .modal h3 { font-size:14px; margin:20px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid label, .modal > label { display:block; font-size:13px; font-weight:500; }
  .grid label input, .grid label select, .modal label input { margin-top:4px; }
  .modal .footer { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:22px; }
  .check input { width:auto; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 20px; border-radius:8px; font-size:14px; display:none; z-index:99; }
</style>
</head>
<body>

<div id="login-view">
  <form class="login-card" id="login-form">
    <h1>Arithmax <span style="color:var(--accent)">Admin</span></h1>
    <p>Panel de administración de usuarios</p>
    <label>Correo electrónico
      <input type="email" id="login-email" required autocomplete="username">
    </label>
    <label>Contraseña
      <input type="password" id="login-password" required autocomplete="current-password">
    </label>
    <div class="error-msg" id="login-error"></div>
    <button class="btn" type="submit">Ingresar</button>
  </form>
</div>

<div id="app-view">
  <header>
    <div class="brand">Arithmax <span>Admin</span></div>
    <div class="right">
      <span id="admin-email"></span>
      <button onclick="logout()">Salir</button>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button id="tab-users" class="active" onclick="showTab('users')">Usuarios</button>
      <button id="tab-purchases" onclick="showTab('purchases')">Compras</button>
    </div>

    <section id="users-section">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar por email o nombre…">
        <button class="btn" onclick="openCreate()">+ Nuevo usuario</button>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>ID</th><th>Email</th><th>Nombre</th><th>Rol</th>
              <th>Licencia</th><th>Vence</th><th>Último login</th><th></th>
            </tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
        <div class="pager">
          <span id="pager-info"></span>
          <div class="btns">
            <button class="btn secondary small" id="prev" onclick="changePage(-1)">← Anterior</button>
            <button class="btn secondary small" id="next" onclick="changePage(1)">Siguiente →</button>
          </div>
        </div>
      </div>
    </section>

    <section id="purchases-section" style="display:none">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Fecha</th><th>Delivery ID</th><th>Estado</th><th>Acción</th><th>Usuario</th><th>Detalle</th>
            </tr></thead>
            <tbody id="purchases-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <form class="modal" id="user-form">
    <h2 id="modal-title">Editar usuario</h2>
    <div class="grid">
      <label>Email<input type="email" name="email" required></label>
      <label>Teléfono<input name="phone"></label>
      <label>Nombre(s)<input name="firstName"></label>
      <label>Apellido paterno<input name="lastName"></label>
      <label>Apellido materno<input name="scdLastName"></label>
      <label>Fecha de nacimiento<input type="date" name="birthDate"></label>
      <label>País<input name="country"></label>
      <label>Género
        <select name="gender">
          <option value="">—</option>
          <option value="female">Femenino</option>
          <option value="male">Masculino</option>
          <option value="other">Otro</option>
        </select>
      </label>
      <label>Rol
        <select name="role">
          <option value="user">Usuario</option>
          <option value="admin">Administrador</option>
        </select>
      </label>
      <label>Nueva contraseña <span class="muted">(opcional)</span><input type="text" name="newPassword" autocomplete="off" placeholder="Dejar vacío para no cambiar"></label>
    </div>
    <label class="check"><input type="checkbox" name="mustChangePassword"> Obligar cambio de contraseña al entrar</label>

    <h3>Licencia</h3>
    <div class="grid">
      <label>Estado
        <select name="licStatus">
          <option value="">Sin licencia / no tocar</option>
          <option value="1">Activa</option>
          <option value="0">Inactiva</option>
        </select>
      </label>
      <label>Plan<input name="licPlanId" placeholder="ej. arithmax-1-ano"></label>
      <label>Inicio<input type="date" name="licStartsAt"></label>
      <label>Vencimiento<input type="date" name="licExpirationDate"></label>
    </div>

    <div class="footer">
      <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button type="submit" class="btn">Guardar</button>
    </div>
  </form>
</div>

<div id="toast"></div>

<script>
const TOKEN_KEY = 'arithmax_admin_token';
let state = { page: 1, pageSize: 25, total: 0, search: '', editingId: null, users: [] };

// ---------- infra ----------
async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data?.error?.message || data?.message || 'Error ' + res.status);
  return data;
}

function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isError ? 'var(--danger)' : '#111827';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.style.display = 'none'), 3500);
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('es-MX', { year:'numeric', month:'short', day:'numeric' }) : '—';
const dateInput = (iso) => (iso ? String(iso).slice(0, 10) : '');

// ---------- sesión ----------
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || data?.message || 'Credenciales inválidas');
    if (data.user?.role !== 'admin') throw new Error('Esta cuenta no tiene rol de administrador');
    localStorage.setItem(TOKEN_KEY, data.token);
    enterApp(data.user.email);
  } catch (err) { errEl.textContent = err.message; }
});

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('app-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'flex';
}

async function enterApp(email) {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  document.getElementById('admin-email').textContent = email;
  await loadUsers();
}

async function boot() {
  if (!localStorage.getItem(TOKEN_KEY)) return;
  try {
    const me = await api('/auth/me');
    if (me.role === 'admin') enterApp(me.email);
    else logout();
  } catch { /* logout ya ejecutado por api() */ }
}

// ---------- tabs ----------
function showTab(tab) {
  document.getElementById('users-section').style.display = tab === 'users' ? '' : 'none';
  document.getElementById('purchases-section').style.display = tab === 'purchases' ? '' : 'none';
  document.getElementById('tab-users').classList.toggle('active', tab === 'users');
  document.getElementById('tab-purchases').classList.toggle('active', tab === 'purchases');
  if (tab === 'purchases') loadPurchases();
}

// ---------- usuarios ----------
let searchTimer;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = e.target.value.trim(); state.page = 1; loadUsers(); }, 350);
});

async function loadUsers() {
  const q = new URLSearchParams({ search: state.search, page: state.page, pageSize: state.pageSize });
  const data = await api('/admin/api/users?' + q).catch((e) => { toast(e.message, true); return null; });
  if (!data) return;
  state.total = data.total;
  state.users = data.users;

  document.getElementById('users-body').innerHTML = data.users.map((u) => {
    const lic = u.license;
    const licBadge = !lic ? '<span class="badge none">Sin licencia</span>'
      : lic.status === 1 ? '<span class="badge active">Activa</span>'
      : '<span class="badge inactive">Inactiva</span>';
    const name = [u.firstName, u.lastName, u.scdLastName].filter(Boolean).join(' ') || '—';
    return `<tr>
      <td>${u.id}</td>
      <td>${esc(u.email)}</td>
      <td>${esc(name)}</td>
      <td>${u.role === 'admin' ? '<span class="badge admin">Admin</span>' : 'Usuario'}</td>
      <td>${licBadge}</td>
      <td>${fmtDate(lic?.expirationDate)}</td>
      <td>${fmtDate(u.lastLoginAt)}</td>
      <td class="actions">
        <button class="btn secondary small" onclick="openEdit(${u.id})">Editar</button>
        <button class="btn secondary small" onclick="sendReset(${u.id}, '${esc(u.email)}')">Reset</button>
        <button class="btn danger small" onclick="removeUser(${u.id}, '${esc(u.email)}')">Eliminar</button>
      </td>
    </tr>`;
  }).join('');

  const from = (state.page - 1) * state.pageSize + 1;
  const to = Math.min(state.page * state.pageSize, state.total);
  document.getElementById('pager-info').textContent = state.total ? `${from}–${to} de ${state.total} usuarios` : 'Sin resultados';
  document.getElementById('prev').disabled = state.page <= 1;
  document.getElementById('next').disabled = to >= state.total;
}

function changePage(delta) { state.page += delta; loadUsers(); }

// ---------- modal crear/editar ----------
const form = document.getElementById('user-form');

function fillForm(u) {
  form.email.value = u?.email ?? '';
  form.phone.value = u?.phone ?? '';
  form.firstName.value = u?.firstName ?? '';
  form.lastName.value = u?.lastName ?? '';
  form.scdLastName.value = u?.scdLastName ?? '';
  form.birthDate.value = dateInput(u?.birthDate);
  form.country.value = u?.country ?? '';
  form.gender.value = u?.gender ?? '';
  form.role.value = u?.role ?? 'user';
  form.newPassword.value = '';
  form.mustChangePassword.checked = u?.mustChangePassword ?? false;
  form.licStatus.value = u?.license ? String(u.license.status ?? 0) : '';
  form.licPlanId.value = u?.license?.planId ?? '';
  form.licStartsAt.value = dateInput(u?.license?.startsAt);
  form.licExpirationDate.value = dateInput(u?.license?.expirationDate);
}

function openCreate() {
  state.editingId = null;
  document.getElementById('modal-title').textContent = 'Nuevo usuario';
  fillForm(null);
  form.mustChangePassword.checked = true;
  document.getElementById('modal-backdrop').classList.add('open');
}

function openEdit(id) {
  const u = state.users.find((x) => x.id === id);
  if (!u) return;
  state.editingId = id;
  document.getElementById('modal-title').textContent = `Editar usuario #${id}`;
  fillForm(u);
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    email: form.email.value.trim(),
    phone: form.phone.value.trim() || null,
    firstName: form.firstName.value.trim() || null,
    lastName: form.lastName.value.trim() || null,
    scdLastName: form.scdLastName.value.trim() || null,
    birthDate: form.birthDate.value || null,
    country: form.country.value.trim() || null,
    gender: form.gender.value || null,
    role: form.role.value,
    mustChangePassword: form.mustChangePassword.checked,
  };
  if (form.newPassword.value.trim()) body.newPassword = form.newPassword.value.trim();
  if (form.licStatus.value !== '') {
    body.license = {
      status: Number(form.licStatus.value),
      planId: form.licPlanId.value.trim() || null,
      startsAt: form.licStartsAt.value || null,
      expirationDate: form.licExpirationDate.value || null,
    };
  }

  try {
    if (state.editingId) {
      await api('/admin/api/users/' + state.editingId, { method: 'PUT', body: JSON.stringify(body) });
      toast('Usuario actualizado');
    } else {
      await api('/admin/api/users', { method: 'POST', body: JSON.stringify(body) });
      toast('Usuario creado');
    }
    closeModal();
    loadUsers();
  } catch (err) { toast(err.message, true); }
});

// ---------- acciones ----------
async function sendReset(id, email) {
  if (!confirm(`¿Enviar correo de restablecimiento de contraseña a ${email}?`)) return;
  try {
    await api(`/admin/api/users/${id}/send-reset`, { method: 'POST' });
    toast('Correo de restablecimiento enviado');
  } catch (err) { toast(err.message, true); }
}

async function removeUser(id, email) {
  if (!confirm(`¿Eliminar al usuario ${email}?\n\nSe borrarán también su licencia, consultantes y datos asociados. Esta acción no se puede deshacer.`)) return;
  if (!confirm('Confirma de nuevo: ¿eliminar definitivamente?')) return;
  try {
    await api('/admin/api/users/' + id, { method: 'DELETE' });
    toast('Usuario eliminado');
    loadUsers();
  } catch (err) { toast(err.message, true); }
}

// ---------- compras ----------
async function loadPurchases() {
  const events = await api('/admin/api/purchase-events?limit=100').catch((e) => { toast(e.message, true); return null; });
  if (!events) return;
  document.getElementById('purchases-body').innerHTML = events.length ? events.map((ev) => `<tr>
    <td>${new Date(ev.createdAt).toLocaleString('es-MX')}</td>
    <td class="muted">${esc(ev.deliveryId)}</td>
    <td><span class="badge ${esc(ev.status)}">${esc(ev.status)}</span></td>
    <td>${ev.action === 'user_created' ? 'Usuario creado' : ev.action === 'license_renewed' ? 'Licencia renovada' : '—'}</td>
    <td>${ev.user ? esc(ev.user.email) : '—'}</td>
    <td class="muted">${esc(ev.error ?? '')}</td>
  </tr>`).join('') : '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">Sin eventos registrados</td></tr>';
}

boot();
</script>
</body>
</html>
